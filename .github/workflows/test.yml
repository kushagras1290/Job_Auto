name: Test job radar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
